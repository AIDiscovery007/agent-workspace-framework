name: Reproduce from a clean workspace
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.lock
      - run: python scripts/release_check.py
      - run: python scripts/demo.py
      - run: python scripts/verify.py --node --report reports/verification.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ matrix.os }}-${{ matrix.python }}
          path: reports/verification.json
